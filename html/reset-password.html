<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha | P.R.O.T.E.G.E.</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="paginaAcesso">
    <main class="cartaoAcesso" aria-labelledby="tituloRedefinir">
        <a class="marcaAcesso" href="index.html">P.R.O.T.E.G.E.</a>
        <p class="subtituloAcesso">Assistência e segurança para idosos</p>
        <section class="formularioAcesso">
            <h1 id="tituloRedefinir">Redefinir senha</h1>
            <p class="textoAcesso">Crie uma nova senha para acessar sua conta.</p>
            <form id="formRedefinirSenha">
                <div class="campoAcesso"><label for="novaSenha">Nova senha</label><input id="novaSenha" type="password"
                        minlength="6" autocomplete="new-password" placeholder="Mínimo 6 caracteres" required></div>
                <div class="campoAcesso"><label for="confirmarNovaSenha">Confirmar nova senha</label><input
                        id="confirmarNovaSenha" type="password" minlength="6" autocomplete="new-password"
                        placeholder="Repita sua senha" required></div>
                <button class="botaoFormulario" type="submit">Salvar nova senha</button>
                <p id="mensagemRedefinir" class="mensagemFormulario" role="status" aria-live="polite"></p>
            </form>
            <a class="voltarInicio" href="login.html">Voltar para o login</a>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js-supabase/supabase-config.js"></script>
    <script src="../js-supabase/script.js"></script>
</body>

</html>
